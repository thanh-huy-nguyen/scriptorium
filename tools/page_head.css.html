<style>
@font-face{font-family:"Source Serif";src:url(fonts/SourceSerif4-Regular.ttf) format("truetype");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Source Serif";src:url(fonts/SourceSerif4-Italic.ttf) format("truetype");font-weight:400;font-style:italic;font-display:swap}
@font-face{font-family:"Source Serif";src:url(fonts/SourceSerif4-SemiBold.ttf) format("truetype");font-weight:600;font-style:normal;font-display:swap}
@font-face{font-family:"Cormorant";src:url(fonts/CormorantGaramond-SemiBold.ttf) format("truetype");font-weight:600;font-display:swap}
@font-face{font-family:"DejaVu Mono";src:url(fonts/DejaVuSansMono.ttf) format("truetype");font-display:swap}
:root{
  --night:#17121F;--night2:#211A2D;--rule:#3A3048;--parch:#F4EDE0;--parch2:#EAE1CF;--edge:#C9B994;
  --brass:#D2AE62;--brass-dk:#9A7A36;--ox:#8E2332;--ox-lt:#F0A3A9;--purple:#4E2A84;--lilac:#C3B6DD;--mist:#A79FB4;
  --ink:#1E1A17;--muted:#4B443D;--teal:#2F5D62;--navy:#2D4B73;--green:#7FC8A0;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--parch);color:var(--ink);font-family:"Source Serif",Georgia,serif;font-size:18px;line-height:1.6}
a{color:var(--purple)}
code,pre{font-family:"DejaVu Mono",ui-monospace,Menlo,monospace}
img{max-width:100%;height:auto;display:block}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px}

/* nav */
nav{position:sticky;top:0;z-index:10;background:rgba(23,18,31,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--rule)}
nav .wrap{display:flex;align-items:center;gap:22px;height:58px}
nav .brand{display:flex;align-items:center;gap:10px;color:var(--parch);text-decoration:none;font-family:"Cormorant",serif;font-size:26px;font-weight:600}
nav .brand img{width:32px;height:32px}
nav .links{margin-left:auto;display:flex;gap:20px;align-items:center}
nav .links a{color:var(--lilac);text-decoration:none;font-size:16px}
nav .links a:hover{color:var(--brass)}
nav .gh{border:1px solid var(--brass-dk);border-radius:999px;padding:4px 14px;color:var(--brass)!important;white-space:nowrap}
@media (max-width:760px){nav .links a:not(.gh){display:none}}

/* hero */
.hero{background:var(--night);color:var(--parch);
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 47px,var(--night2) 47px,var(--night2) 48px);
  padding:72px 0 64px;border-bottom:3px solid var(--brass-dk)}
.hero .grid{display:grid;grid-template-columns:1.05fr 1fr;gap:48px;align-items:center}
@media (max-width:900px){.hero .grid{grid-template-columns:1fr}}
.kicker{font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass)}
h1{font-family:"Cormorant",serif;font-weight:600;font-size:clamp(48px,7vw,84px);line-height:1;margin:12px 0 18px;color:var(--parch)}
.tagline{font-style:italic;color:var(--brass);font-size:clamp(21px,2.4vw,27px);line-height:1.35;margin:0 0 18px}
.lede{color:var(--lilac);margin:0 0 26px}
.authors{color:var(--mist);font-size:16px;margin:0 0 26px}
.authors b{color:var(--parch);font-weight:600}
.btns{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:10px;text-decoration:none;font-weight:600;font-size:16px;border:1px solid var(--brass-dk)}
.btn.primary{background:var(--brass);color:var(--night);border-color:var(--brass)}
.btn.ghost{color:var(--parch)}
.btn:hover{transform:translateY(-1px)}
.term{border-radius:14px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.45);border:1px solid var(--rule)}

/* sections */
section{padding:72px 0}
section.alt{background:var(--parch2)}
section.dark{background:var(--night);color:var(--parch)}
h2{font-family:"Cormorant",serif;font-weight:600;font-size:clamp(34px,4vw,46px);line-height:1.1;margin:0 0 14px}
.sub{color:var(--muted);max-width:760px;margin:0 0 34px}
section.dark .sub{color:var(--lilac)}
.figure{background:#fff;border:1px solid var(--edge);border-radius:14px;padding:18px;margin:26px 0 8px}
.cap{font-size:15px;color:var(--muted);margin:10px 4px 0}

/* stat cards */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
@media (max-width:820px){.stats{grid-template-columns:1fr}}
.stat{background:var(--night2);border:1px solid var(--rule);border-radius:14px;padding:26px}
.stat .num{font-family:"Cormorant",serif;font-weight:600;font-size:56px;line-height:1;color:var(--brass)}
.stat .what{color:var(--parch);font-weight:600;margin:10px 0 6px}
.stat p{color:var(--lilac);font-size:16px;margin:0}

/* code */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media (max-width:820px){.cols{grid-template-columns:1fr}}
.code{position:relative;background:var(--night);color:var(--parch);border-radius:12px;padding:46px 20px 18px;font-size:14.5px;line-height:1.55;overflow-x:auto;border:1px solid var(--rule)}
.code .label{position:absolute;top:10px;left:20px;font-size:12px;color:var(--mist);font-family:"Source Serif",serif;letter-spacing:.08em;text-transform:uppercase}
.code pre{margin:0;white-space:pre}
.k{color:#B9A3E3}.s{color:#9FD3B0}.c{color:var(--mist);font-style:italic}.bad{color:var(--ox-lt)}.ok{color:var(--green)}.b{color:var(--brass)}
.copy{position:absolute;top:8px;right:10px;background:var(--night2);color:var(--brass);border:1px solid var(--brass-dk);border-radius:8px;padding:3px 10px;font-size:13px;cursor:pointer;font-family:"Source Serif",serif}
.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:28px}
@media (max-width:820px){.rules{grid-template-columns:1fr}}
.rule{background:#fff;border:1px solid var(--edge);border-left:4px solid var(--purple);border-radius:10px;padding:16px 18px}
.rule b{display:block;margin-bottom:4px}
.rule span{font-size:16px;color:var(--muted)}

/* table */
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--edge);border-radius:12px;overflow:hidden;font-size:16.5px}
th,td{padding:11px 16px;text-align:left;border-bottom:1px solid #E6DCC8}
th{background:#EDE3CF;font-weight:600}
td.n{text-align:center;font-variant-numeric:tabular-nums}
tr.ours td{background:#ECE8F2}
tr.ours td:first-child{font-weight:600;color:var(--purple)}
.tablewrap{overflow-x:auto}

/* findings */
.find{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin-top:30px}
@media (max-width:820px){.find{grid-template-columns:1fr}}
.find div{background:#fff;border:1px solid var(--edge);border-radius:12px;padding:18px 20px}
.find h3{font-family:"Cormorant",serif;font-size:27px;margin:0 0 6px;color:var(--ox)}
.find p{margin:0;font-size:16.5px;color:var(--muted)}

.bib{position:relative}
footer{background:var(--parch2);border-top:1px solid var(--edge);padding:36px 0;color:var(--muted);font-size:15px}
footer .wrap{display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:space-between}
footer img{height:22px;width:auto}
.team{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:26px}
@media (max-width:900px){.team{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.team{grid-template-columns:1fr}}
.agent{background:#fff;border:1px solid var(--edge);border-radius:12px;padding:16px 18px;position:relative}
.agent .no{position:absolute;top:14px;right:16px;width:26px;height:26px;border-radius:50%;background:var(--purple);color:#fff;font-size:14px;display:flex;align-items:center;justify-content:center}
.agent h3{font-family:"Cormorant",serif;font-size:26px;margin:0 0 4px;color:var(--purple)}
.agent p{margin:0 0 8px;font-size:16px;color:var(--muted)}
.agent .chk{font-size:14.5px;color:var(--teal)}
.pages{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin-top:22px}
@media (max-width:700px){.pages{grid-template-columns:1fr}}
.pages img{border:1px solid var(--edge);border-radius:6px;box-shadow:0 10px 30px rgba(30,26,23,.18)}
</style>
